name: Bug report
description: Report reproducible behavior that does not work as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve FaceScrap. Search existing issues and test the latest available release before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for the same problem.
          required: true
        - label: I tested the latest available FaceScrap version.
          required: true
        - label: I have permission to use the affected account and content.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and when it occurs.
      placeholder: The side panel remains empty after I play a reel.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the shortest reliable sequence.
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 139 / Edge 138 / Brave 1.72
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FaceScrap version
      description: Enter the release tag or commit.
      placeholder: v1.0.1
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected area
      options:
        - Now Playing
        - Library or Saved
        - Reel, story, or highlight
        - Video page
        - Direct download
        - Merged video and audio
        - Settings
        - Installation or build
        - Other
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and diagnostics
      description: Attach screenshots or a diagnostics export after reviewing it. Do not include private data, cookies, headers, or signed resource values.
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: checkboxes
    id: privacy
    attributes:
      label: Attachment review
      options:
        - label: I reviewed every attachment and removed private information.
          required: true
