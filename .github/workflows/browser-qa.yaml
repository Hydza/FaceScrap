name: Browser QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - id: cft-version
        shell: pwsh
        run: '"version=$((Get-Content .cft-version -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: ${{ steps.cft-version.outputs.version }}
      - run: npm ci
      - run: npm run build
      - run: npm run qa:matrix
        env:
          FACESCRAP_CFT_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-qa
          path: artifacts/qa/
          if-no-files-found: warn
          retention-days: 7
