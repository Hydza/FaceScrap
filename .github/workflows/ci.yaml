name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPOSITORY_POLICY_HISTORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        # Test the release runtime and the current forward-compatibility target.
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # Verify deterministic tracked icons.
      - run: git diff --exit-code -- icons/
      - if: matrix.node-version == 24
        run: npm run quality:code
      - if: matrix.node-version == 24
        run: npm run package:archive
      - if: matrix.node-version == 24
        run: npm run audit
      - if: matrix.node-version == 24
        run: npm run audit:signatures
